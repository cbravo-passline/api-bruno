info:
  name: 3. Verify
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}/auth/verify"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"access\": \"{{Token_productor}}\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

