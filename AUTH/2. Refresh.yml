info:
  name: 2. Refresh
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/auth/refresh"
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"refresh\": \"{{Token_refresh_productor}}\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

