              {
                  "acerca_de_passline": "<b>Sobre Passline</b><br>\nPassline es una plataforma de eventos global que te permite crear, buscar, compartir y asistir a tus eventos favoritos. Desde festivales de música, fiestas, conferencias, workshops, eventos streaming / ondemand, maratones, competencias de videojuegos, discotecas y mucho más.\n<br>\nNuestra misión es darle a todos nuestros usuarios la herramienta para que puedan administrar y comercializar sus eventos gratis, además del espacio para que puedan encontrar y saber todo lo que hay para hacer.\n<br>\n<b>Funcionamiento de Passline</b>\n¡Es muy fácil! debes ingresar a nuestra página de INICIO e ir arriba a la derecha donde dice CREAR EVENTO. Allí podrás crear tu evento y automáticamente generar una ticketera online ofreciendo todos los medios de pago (tarjetas y efectivo).\n<br>\nAccede a un panel de control, que te permitirá administrar todo lo que necesitas para gestionar la venta y control de acceso para tus eventos.<br>\n<br>\n<b>¿Por qué Passline?</b><br>\nSomos la ticketera con más eventos en el Mercado. Contamos con un equipo de profesionales enfocados en el desarrollo de nuevas tecnologías y en hacer crecer los negocios de nuestros clientes.\n<br>\nNuestra plataforma te entrega toda la exposición que tu evento necesita, mediante la publicación de tu evento en nuestra cartelera y redes sociales.<br>\n<b>Streaming / On Demand</b><br>\nPor eso diseñamos un sistema donde puedas disfrutar los mejores eventos, de tus artistas preferidos sin importar donde estés. Sólo debes adquirir tu entrada e ingresar desde tu celular, tablet, PC o SmartTv."
              }
