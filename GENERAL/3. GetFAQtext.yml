  Respuesta Ejemplo:

  StartFragment

  {    "preguntas_frecuentes": "¿Qué es Passline?\\n\\n    Passline es el primer servicio donde puedes pagar de manera fácil, rápida y en tiempo real tus entradas a eventos, discotecas, conciertos y mucho más.\\n\\n    La aplicación te permite revisar de manera rápida los distintos eventos, todos georreferenciados según tu ubicación o interés. Ya no más filas de espera para comprar tus entradas mientras te pierdes toda la entretención.\\n\\n    Passline es una aplicación social que permite publicar todo tipo de eventos y generar una ticketera online. Además agrupa todos los eventos en un solo lugar para que asi sea más cómoda y expedita la venta de entradas.\\n\\n    Bajo la perspectiva de desarrollo social, permite dinamizar y fortalecer el apoyo al emprendimiento y la cultura promoviendo la difusión de eventos y exposiciones en espacios públicos y privados.\\n\\n¿Cómo Compro una Entrada?\\n\\n    Para comprar tus entradas a eventos es muy simple, solo debes encontrar tu panorama favorito e ingresar a la ficha del evento.\\n\\n    Dentro de la ficha debes seleccionar el tipo de entrada que quieres, seleccionar la cantidad de tickets y apretar el botón COMPRAR.\\n\\n    Luego debes seguir las instrucciones del Carro de Compra.\\n\\n¿Cómo Pago Mis Entradas?\\n\\n    Muy simple una vez que has seleccionado tus entradas, debes pagar con Webpay de Transbank. Que será una compra segura.\\n\\n¿Dónde Recibo Mis Entradas?\\n\\n    Una vez que tu compra ha sido validada por Transbank y Passline las entradas estarán disponibles en tu cuenta de usuario Passline y en tu correo electrónico en nuestro formato eTicket Digital.\\n\\n¿Cómo Presento Mis Entradas?\\n\\n    ¡MUY SIMPLE! Las entradas debes ser presentadas en tu Smartphone al llegar al evento, será escaneado su código QR o validado con el dígito validador.\\n\\n¿Dónde Modifico Mis Datos?\\n\\n    Para modificar tus datos, ver entradas compradas, etc. debes ingresar a Tu Cuenta y en esta sección encontraras:\\n\\n    • Editar tus Datos\\n    • Cambiar Clave\\n    • Mis eTickets\\n    • Crear Evento\\n    • Mis Eventos\\n    • Datos de Organizador"}

  EndFragment
