          {
              "preguntas_frecuentes": "<div style=\"font-weight: normal;\"><b>¿Qué es Passline?&nbsp;</b></div><div style=\"font-weight: normal;\"><b><br></b></div><div style=\"font-weight: normal;\">Passline es el primer servicio donde puedes pagar de manera fácil, rápida y en tiempo real tus entradas a eventos, discotecas, conciertos y mucho más.\n\n    La aplicación te permite revisar de manera rápida los distintos eventos, todos georreferenciados según tu ubicación o interés.&nbsp;</div><div style=\"font-weight: normal;\">Ya no más filas de espera para comprar tus entradas mientras te pierdes toda la entretención.\n\n    Passline es una aplicación social que permite publicar todo tipo de eventos y generar una ticketera online. Además agrupa todos los eventos en un solo lugar para que asi sea más cómoda y expedita la venta de entradas.&nbsp;</div><div style=\"font-weight: normal;\">Bajo la perspectiva de desarrollo social, permite dinamizar y fortalecer el apoyo al emprendimiento y la cultura promoviendo la difusión de eventos y exposiciones en espacios públicos y privados.&nbsp;</div><div style=\"font-weight: normal;\"><br></div><div style=\"font-weight: normal;\"><b>¿Cómo Compro una Entrada?&nbsp;</b></div><div style=\"font-weight: normal;\"><br></div><div style=\"font-weight: normal;\">Para comprar tus entradas a eventos es muy simple, solo debes encontrar tu panorama favorito e ingresar a la ficha del evento.\n\n    Dentro de la ficha debes seleccionar el tipo de entrada que quieres, seleccionar la cantidad de tickets y apretar el botón COMPRAR.\n\n    Luego debes seguir las instrucciones del Carro de Compra.&nbsp;</div><div style=\"font-weight: normal;\"><br></div><div style=\"\"><b>¿Cómo Pago Mis Entradas?</b></div><div style=\"font-weight: normal;\"><br></div><div style=\"font-weight: normal;\">Muy simple una vez que has seleccionado tus entradas, debes pagar con Webpay de Transbank. Que será una compra segura.&nbsp;</div><div style=\"font-weight: normal;\"><br></div><div style=\"\"><b>¿Dónde Recibo Mis Entradas?&nbsp;</b></div><div style=\"font-weight: normal;\"><br></div><div style=\"font-weight: normal;\">Una vez que tu compra ha sido validada por Transbank y Passline las entradas estarán disponibles en tu cuenta de usuario Passline y en tu correo electrónico en nuestro formato eTicket Digital.&nbsp;</div><div style=\"font-weight: normal;\"><br></div><div style=\"\"><b>¿Cómo Presento Mis Entradas?&nbsp;</b></div><div style=\"font-weight: normal;\"><br></div><div style=\"font-weight: normal;\">¡MUY SIMPLE! Las entradas debes ser presentadas en tu Smartphone al llegar al evento, será escaneado su código QR o validado con el dígito validador.&nbsp;</div><div style=\"font-weight: normal;\"><br></div><div style=\"\"><b>¿Dónde Modifico Mis Datos?&nbsp;</b></div><div style=\"font-weight: normal;\"><br></div><div style=\"font-weight: normal;\">Para modificar tus datos, ver entradas compradas, etc. debes ingresar a Tu Cuenta y en esta sección encontraras:&nbsp;&nbsp;</div><div style=\"font-weight: normal;\">• Editar tus Datos&nbsp;&nbsp;</div><div style=\"font-weight: normal;\">• Cambiar Clave&nbsp;&nbsp;</div><div style=\"font-weight: normal;\">• Mis eTickets&nbsp;&nbsp;</div><div style=\"font-weight: normal;\">• Crear Evento&nbsp;&nbsp;</div><div style=\"font-weight: normal;\">• Mis Eventos&nbsp;&nbsp;</div><div style=\"font-weight: normal;\">• Datos de Organizador</div>"
          }
