                          "vendidas": "1",
                          "terms_conditions": "<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:left;direction:ltr;unicode-bidi:embed\">Agregar\ncontenido de texto extra por entrada.<br>\n<br>\n¡Hola!</p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\"> </p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\">Has\nadquirido una entrada para visitar la Experiencia Virtual (Streaming) de\nla exposición internacional “Magister Raffaello, un viaje por el Renacimiento italiano”\nen Museo Artequin.</p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\"> </p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\">A\ntravés de este link podrás visitar y recorrer libremente la experiencia para\npúblico general de Magister Raffaello.</p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\"> </p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:left;direction:ltr;unicode-bidi:embed\"><u style=\"text-underline:single\">https://my.matterport.com/show/?m=kKNkCjJUMWq</u></p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:left;direction:ltr;unicode-bidi:embed\"> </p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\">A\ntravés de este link podrás visitar la Experiencia Educativa (Online) de\nla Exposición Magister Raffaello en\nMuseo Artequin para\n5º a\n8º Básico.</p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\"> </p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\">Link\n5º a 8º Básico</p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\"> </p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\">Después\nde vivir la experiencia Magister Raffaello puedes descargar desde este link las actividades\neducativas\nasociadas a 5º a\n8º Básico. </p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\"> </p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\"><u style=\"text-underline:single\">https://www.artequin.cl/wp-content/uploads/2020/06/Plantilla-5_8_Basico-compressed.pdf</u></p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\"> </p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\">Esperamos\nque disfruten de la experiencia y nos puedan visitar en una próxima\noportunidad.</p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\"> </p>\n\n<p style=\"language:es-CL;line-height:normal;margin-top:0pt;margin-bottom:0pt;\nmargin-right:0in;text-align:justify;text-justify:inter-ideograph;direction:\nltr;unicode-bidi:embed\">Museo\nArtequin</p>"
