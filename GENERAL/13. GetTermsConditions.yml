info:
  name: 13. GetTermsConditions
  type: http
  seq: 14

http:
  method: GET
  url: "{{url}}/general/GetTermsConditions/chile"
  headers:
    - name: content-type
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
