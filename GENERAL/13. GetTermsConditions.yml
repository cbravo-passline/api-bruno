    request:
      url: "{{url}}/general/GetTermsConditions/chile"
      method: GET
      headers:
        - name: content-type
          value: application/json
    response:
      statusText: "200"
      headers:
        - name: Date
          value: Thu, 24 Oct 2024 17:36:27 GMT
        - name: Content-Type
          value: application/json
        - name: Transfer-Encoding
          value: chunked
        - name: Connection
          value: keep-alive
        - name: x-powered-by
          value: Passline
        - name: access-control-allow-origin
          value: "*"
        - name: access-control-allow-methods
          value: GET, POST, PUT, DELETE, OPTIONS
        - name: access-control-allow-headers
          value: Access-Control-Allow-Headers, Origin,Accept, X-Requested-With, Content-Type, Access-Control-Request-Method, Access-Control-Request-Headers, Authorization
        - name: access-control-max-age
          value: "300"
        - name: via
          value: 1.1 google
        - name: CF-Cache-Status
          value: DYNAMIC
        - name: Server
          value: cloudflare
        - name: CF-RAY
          value: 8d7bbaa17f22bfac-ATL
        - name: Content-Encoding
          value: br
      body:
        type: json
        data: |-
          [
              {
                  "tyc_productores_columna1": "PRIMERO: Condiciones Generales.\n\nGracias por utilizar los servicios de Passline. Passline proveerá a Ud. sus servicios de acuerdo con los siguientes Términos y Condiciones de Servicio (TCS), los cuales podrán ser periódicamente actualizados por Passline sin notificación previa.\n\nSEGUNDO: Antecedentes.\n\nPassline provee recursos destinados a facilitar la organización de actividades culturales, académicas, deportivas, artísticas y recreaciones en general, incluyendo herramientas de comunicación, foros, servicios de pago, y contenido personalizado, al que se puede acceder a través de diversos medios o dispositivos conocidos o a ser desarrollados en el futuro.\n\nEntre sus servicios, Passline facilita la venta de entradas para espectáculos artísticos, culturales, deportivos y/o recreativos, en adelante los “Eventos”, a través de la venta de forma presencial, por módulos o tótems electrónicos de auto-atención y/o por medios remotos e Internet (electrónica).\n\nPassline actúa como mandataria, esto es, por cuenta y orden de el organizador o gestor del evento o espectáculo, en adelante el “Organizador”, prestando a este último los servicios de venta y distribución de entradas para los eventos, en alguna de las formas señaladas en el numeral anterior.\n\nEl Organizador es el único y exclusivo responsable de la producción y organización del Evento. Recae exclusivamente sobre el Organizador la responsabilidad de la correcta y oportuna realización del Evento. Conforme lo anterior, el Organizador se reputa el único vendedor y prestador del servicio y, por lo tanto, es el único sujeto de las obligaciones y sanciones de la Ley Nº 19.496 sobre Protección de los Derechos de los Consumidores.\n\nTERCERO: Descripción del servicio.\n\nEn virtud del presente instrumento, Passline facilita a los Organizadores de Eventos una Plataforma de registro de eventos y venta de entradas. Passline revisa la información del evento que el Organizador desea registrar; publica el evento en su Plataforma y/o habilita los módulos de auto atención; y se compromete a transferir de acuerdo con las cláusulas siguientes los dineros que se perciban por la venta de las entradas deduciendo la comisión acordada y/o cargo por servicio.\n\nPassline autoriza al Organizador de forma no exclusiva para para hacer uso de la Plataforma. La Propiedad Intelectual de la Plataforma pertenece única y exclusivamente a Passline. El Organizador no adquiere titularidad ni propiedad alguna sobre la Plataforma ni sobre sus futuras mejoras o nuevos desarrollos.\n\nEl servicio de Passline no garantiza de ninguna manera que el Organizador recibirá participantes en su evento ni que este se desarrollará correctamente.\n\nAl registrar un evento a través de la Plataforma, el Organizador autoriza a, Passline a efectuar y retener los cobros por su cuenta asociados a la venta de entradas para su evento.\n\nEl Organizador reconoce que es su obligación pagar IVA o cualquier tipo de impuesto asociado a la Organización del Evento, obligándose además a emitir todos los comprobantes fiscales a los usuarios o participantes que recibieren o realizaren una inscripción a través del Servicio.\n\nPassline transferirá al Organizador los dineros que se perciban en alguna de las modalidades de pago habilitadas por la venta de los tickets para el o los eventos válidamente inscritos en su Plataforma, deduciendo las comisiones y/o cargo por servicio correspondientes acordadas por las partes. Passline emitirá, al organizador el comprobante fiscal correspondiente por las comisiones y/o cargo por servicio cobrados.\n\nPassline no es una entidad financiera ni presta servicios bancarios o cambiarios. Los fondos acreditados en la cuenta Passline no generan intereses.\n\nCUARTO: Condiciones.\n\nEl Organizador es el único y exclusivo responsable de la producción y organización del Evento, por lo que Passline no asume responsabilidad a este respecto.\n\nEl Organizador definirá las cantidades y los valores de las entradas disponibles para la venta, las reglas de acceso a eventos y en general las características del mismo. El Organizador es el único responsable de entregar comprobante fiscal por los servicios que se compromete a entregar y del pago de todos los impuestos asociados. Passline en ningún caso se hará responsable del pago del IVA o de cualquier otro impuesto derivado de la venta de entradas que deba pagar el Organizador. Tampoco se asumen responsabilidades derivadas de la veracidad del contenido publicitario del evento, ejecución del mismo, medidas de seguridad del local donde se realice, o cualquier otro elemento similar.\n\nPor este acto, el Organizador declara su conformidad con las condiciones antes descritas y se compromete a dar información verídica de todos los datos relativos a su evento.\n\nQUINTO: Condiciones de Pago a Organizadores por conceptos de venta de Tickets.\n\nPassline actuará como “retenedor” de los dineros provenientes de la venta de tickets o entradas a los eventos que el Organizador ha incluido en su página web. Dichos dineros serán transferidos al Organizador con las deducciones correspondientes dentro del plazo de 15 días hábiles contados desde la realización del evento.\n\nLos montos autorizados descontando el cargo por servicio acordado previamente con Passline por los servicios prestados por esta última, se harán mediante depósito en una cuenta corriente previamente indicada por el Organizador a Passline y esta no podrá ser modificada sin el consentimiento de Passline. Es por ello que le solicitamos revisar detalladamente los datos bancarios para evitar futuros errores o retrasos en el depósito de sus acreencias.\n\nProducto de la realización del Evento, el Productor tiene el derecho a que Passline, le deposite las ganancias del mismo una vez descontadas las comisiones pactadas. Sin perjuicio de lo anterior, si por cualquier causa ya sea antes, durante o después del Evento, algún Cliente presentare alguna denuncia, cuestionamiento o solicitud ante el SERNAC (Servicio Nacional del Consumidor), en virtud de este contrato se autoriza a Passline para poder retener los dineros descritos en esta cláusula hasta que se hayan solucionado todas las denuncias deducidas. Todos los costos que se originen por este ítem serán válidamente descontados de las comisiones y ventas del productor y Passline no cubrirá o asumirá responsabilidad y/o gasto alguno en el desempeño de esta gestión más que en los casos que corresponda responder al Cliente y coordinar las devoluciones de dinero respectivas.\n\nSEXTO: Cancelación, postergación o suspensión de un evento.\n\nLa cancelación de un Evento obligará al Organizador a reembolsarle a los compradores el valor de las entradas, previa notificación al público de la cancelación respectiva. Del mismo modo, en caso de suspensión o postergación, el Organizador está obligado a reembolsarle a los compradores que lo soliciten el valor de las entradas, previa notificación al público de su suspensión o postergación.\n\nEn estos casos, el Organizador deberá informar de la cancelación, postergación o suspensión del evento en los medios de comunicación que haya elegido como patrocinadores, oficiales o de difusión del Evento. Tal aviso se dará en el menor plazo posible a contar del momento en que hubiese tomado la determinación o a partir de que concurran circunstancias que hagan prever que no será posible realizar el Evento conforme la programación en curso.\n\nSin perjuicio de lo expuesto en el párrafo anterior, deberá dar aviso de tal circunstancia de forma inmediata a Passline con el fin de poner fin a la venta de entradas.\n\nEn caso de cancelación, postergación o suspensión de un evento, Passline queda expresamente facultado para retener hasta por 6 meses después de la fecha fijada originalmente para el evento, todos los fondos asociados a la venta de entradas para el mismo, con el fin de reembolsar a los compradores de dichas entradas. Transcurrido dicho plazo, Passline no cursará reembolsos, los que deberán efectuarse directamente por el Organizador.\n\nEl Reembolso lo hará Passline contra los fondos recaudados por la venta de entradas y hasta agotamiento de estos.\n\nCon todo, el Organizador será el único responsable de la obligación de reembolso de las entradas, actuando Passline en virtud de diputación para el pago y en calidad de mandatario simple del Organizador, sin ulterior responsabilidad para Passline.\n\nPassline cobrará al Organizador todos los gastos que le causen la cancelación, postergación o suspensión del Evento, los que podrá deducir de cualquier dinero correspondiente al Organizador que se encuentre en su poder. Asimismo, Passline repetirá en contra el Organizador cualquier pago, multa o indemnización que se vea obligada a pagar a terceros con motivo de la cancelación, postergación o suspensión del Evento, en especial reembolsos de entradas.\n\nSEPTIMO: Capacidad del Organizador.\n\nUsted debe ser mayor de 18 años para acceder al servicio de Passline, revisar esos contenidos y solicitar la cobranza de inscripciones. Passline no recogerá información personal de personas menores de 18 años de manera intencional. Si usted es menor de 18 años, le pedimos que no ingrese información personal a través de nuestros servicios. Passline sugiere a todos los padres de familia y tutores legales monitorear el uso de internet de sus hijos buscando evitar que realicen transacciones monetarias sin su autorización. Si usted tiene algún motivo para sospechar de que un menor de 18 años este realizando operaciones o el uso mismo de nuestros servicios, por favor contáctenos para proceder con la eliminación permanente de los datos ingresados por ellos de nuestros registros.\n\nComo una condición entendida como esencial en el presente contrato, Ud. declara que posee capacidad legal para contratar y que no posee ningún impedimento para recibir servicios bajo las leyes Chilenas y su jurisdicción. Asimismo, Ud. se obliga a: (a) proveer información verdadera, correcta, actual y completa acerca de su persona del modo requerido en el formulario de registro del Servicio (información denominada en adelante Datos de Registro), y (b) mantener y actualizar en todo momento los Datos de Registro a fin de conservarlos veraces, correctos, actuales y completos. Si suministra información que es falsa, inexacta, desactualizada o incompleta, o si Passline tiene bases razonables para sospechar cualquiera de las situaciones anteriores podrá suspender o cerrar su cuenta y negarle el uso futuro del Servicio.\n\nOCTAVO: Política de Privacidad.\n\nSus Datos de Registro e información válidamente entregada se encuentra sujeta a nuestra Política de Privacidad. Para mayor información, vea nuestra política de privacidad en forma completa en: Política de privacidad.\n\nNOVENO: Cuenta de Usuario, Contraseña y Seguridad.\n\nLuego de completar el proceso de registro al Servicio, Ud. recibirá una contraseña y una designación de cuenta. Ud. será responsable de mantener la confidencialidad de la contraseña y de la cuenta, siendo también único y absoluto responsable por todas las actividades que ocurran bajo su contraseña o cuenta. Ud. se compromete a: (a) notificar inmediatamente a Passline de cualquier uso no autorizado de su contraseña o cuenta o de cualquier otra violación de seguridad, y (b) asegurarse de que su cuenta sea cerrada al final de cada sesión. Passline no será responsable por ninguna pérdida o daño que resulte como consecuencia de su incumplimiento a las disposiciones de este artículo.\n\nDECIMO: Obligaciones y Conducta del Usuario.\n\nUsted comprende y acepta que toda la información, datos, textos, software, música, sonido, fotografías, gráficos, video, mensajes u otros materiales entendiendo de aquí en adelante como el “Contenido”, sea que se fijen públicamente o se transmitan privadamente, son únicamente responsabilidad de la persona que lo originó, por lo que Passline no se hace responsable del mismo.\n\nPassline no controla el Contenido publicado a través del Servicio y, por tal motivo, no garantiza la exactitud, integridad o su calidad. Ud. comprende y acepta que por el uso del Servicio, Ud. puede estar expuesto a Contenido que puede ser ofensivo, indecente o cuestionable. Bajo ninguna circunstancia Passline será responsable en cualquier forma por este.\n\nUsted se obliga a no usar el Servicio para lo siguiente: (a) Cargar (upload), publicar, enviar vía correo electrónico, transmitir o de cualquier otra forma poner a disposición Contenido que sea ilegal, peligroso, negativo, amenazante, abusivo, hostigador, tortuoso, difamatorio, vulgar, obsceno, calumnioso, discriminatorio, o de cualquier otra forma cuestionable, (b) Hacerse pasar por alguna persona o entidad, incluyendo, a un funcionario empleado de Passline, líder de foro, guía o anfitrión, o hacer declaraciones falsas, o de cualquier otra forma falsificar su asociación a alguna persona o entidad. (c) Falsificar encabezados o de cualquier otra forma manipular identificadores para desviar el origen de algún Contenido transmitido por medio del Servicio (d) Cargar (upload), publicar, enviar vía correo electrónico, transmitir, o poner a disposición algún contenido del cual no se tiene el derecho de transmitir por ley o en virtud de una relación contractual o fiduciaria (tal como información interna, de propiedad y confidencial adquirida o entregada como parte de las relaciones de empleo o bajo contratos de confidencialidad). (e) Cargar, publicar, enviar vía correo electrónico, transmitir, o poner a disposición algún Contenido que viole patentes, marcas, secretos comerciales, derechos de autor o cualquier derecho de propiedad de algún tercero. (f) Cargar, publicar, enviar vía correo electrónico, transmitir, o poner a disposición algún material que contenga virus de software, o cualquier otro código de computadora, archivos o programas diseñados para interrumpir, destruir o limitar el funcionamiento de algún software, hardware o equipo de telecomunicaciones. (g) Interrumpir el flujo normal de diálogo, hacer que una pantalla se mueva (scroll) más rápido de lo que otros usuarios pueden manejar, o de cualquier otra forma actuar de manera que afecte negativamente la habilidad de otros usuarios para vincularse en intercambios de tiempo reales. (h) Interferir o interrumpir el Servicio, servidores, o redes conectadas al Servicio, o desobedecer cualquier requisito, procedimiento, política o regulación de redes conectadas al Servicio. (i) Violar con o sin intención, alguna ley nacional o internacional aplicable. (j) Acechar o de cualquier otra forma hostigar a un tercero; o colectar o guardar datos personales acerca de otros usuarios.\n\nSin limitación de lo anterior, Passline tendrá el derecho de remover cualquier Contenido que viole los términos establecidos en el presente contrato. Usted acuerda que debe evaluar y que asume todos los riesgos asociados con el uso de cualquier Contenido, incluyendo su confianza en la veracidad, integridad o utilidad de dicho Contenido.\n\nUd. reconoce que el Servicio y el software incluido en este puede incluir componentes de seguridad que permiten la protección a materiales digitales, y que el uso de estos materiales está sujeto a las reglas de uso establecidas por Passline y/o por aquellos que proveen contenido al Servicio. Ud. no podrá intentar anular o eludir cualquiera de estas reglas de uso establecidas. Cualquier reproducción, publicación, distribución o comunicación pública, total o parcial, no autorizada de los materiales provistos en el Servicio, está estrictamente prohibida.\n\nUNDÉCIMO: Contenido Puesto a su Disposición Para Inclusión en el Servicio.\n\nPassline no es propietario del Contenido que Ud. envíe o ponga a disposición para su inclusión en el Servicio. Sin embargo, respecto del Contenido que Ud. envíe o ponga a disposición para su inclusión en áreas de acceso público del Servicio, Ud. otorga a Passline la siguiente licencia mundial, gratuita, y no exclusiva según corresponda. Con respecto al Contenido que Ud. elija o ponga a disposición para su inclusión en áreas de acceso público de Servicios, la licencia para usar, distribuir, reproducir, modificar, adaptar, comunicar al público, y publicar dicho Contenido en el Servicio.\n\nEsta licencia existirá sólo por el período en que Ud. decida continuar incluyendo dicho Contenido en el Servicio, y se terminará en el momento en que Ud. o Passline renueven dicho Contenido de la Web.",
                  "tyc_productores_columna2": "Con respecto a cualquier otro Contenido distinto de fotos, gráficos, audio o video que Ud. envíe o ponga a disposición para su inclusión en otras áreas de acceso público del Servicio distintas de Grupos Passline, la licencia para usar, reproducir, modificar, adaptar, publicar, traducir, comunicar al público y publicar dicho Contenido en cualquier formato o medio conocido o a ser desarrollado en el futuro.\n\nPara estos efectos, Áreas de acceso público de Servicio son aquellas áreas de la red de propiedades de Passline que estén disponibles al público en general. Por ejemplo, las áreas de acceso público del Servicio incluirían las Pizarras de Mensajes de las actividades, el contenido de las Actividades Públicas Pasadas, que están abiertas tanto a miembros como a visitantes. Sin embargo, las áreas de acceso público del Servicio no incluirán la posibilidad de Crear una Actividad para lo cual el visitante debe estar previamente registrado como usuario de Passline, o áreas fuera de la red de propiedad de Passline, tales como los sitios de la World Wide Web (WWW) a los que se puede acceder a vínculos porque no están alojadas en o servidas por esta última.\n\nDUODÉCIMO: Indemnidad.\n\nUsted se compromete a indemnizar y mantener indemne y libre de daños a Passline, sus socios y empleados, de cualquier reclamo o demanda, incluyendo honorarios razonables de los abogados, iniciados por terceros debido a o con origen en el Contenido que Ud. envíe, publique, transmita o ponga a disposición por medio del Servicio.\n\nDÉCIMO TERCERO: Prohibición de Revender el Servicio.\n\nUsted se compromete a no reproducir, duplicar, copiar, vender, comercializar, revender o explotar con cualquier propósito comercial ninguna parte del Servicio (incluyendo su nombre de usuario de Passline.\n\nDÉCIMO CUARTO: Practicas Generales Acerca del Uso y Almacenamiento.\n\nPassline puede establecer prácticas generales y límites con respecto al uso del Servicio, incluyendo, (a) el número máximo de días que los eventos estarán disponibles para registrarse, (b) anuncios publicados en el newsletter / boletín de mensajes, (c) el número máximo de mensajes de correo electrónico que puedan ser enviados o recibidos por una cuenta en el Servicio, (d) los montos máximos y mínimos que pueden ser cobrados por un evento, (e) la cantidad de tickets que pueden emitirse, (f) el tamaño máximo de cualquier mensaje de correo electrónico que pueda ser mandado o recibido por una cuenta en el Servicio, (g) el espacio máximo de disco que será asignado en los servidores de Passline para su beneficio, y (h) el número máximo de veces que Ud. podrá tener acceso al Servicio en un período dado, así como (i) la máxima duración de cada uno de los accesos.\n\nUd. acepta que Passline no tiene responsabilidad u obligación por el borrado o falla en el almacenamiento de mensajes u otras comunicaciones, o cualquier otro Contenido mantenido o transmitido. Ud. acepta que Passline se reserva el derecho de dar de baja cuentas que han estado inactivas por un período prolongado de tiempo y de modificar estas prácticas generales y límites en cualquier momento, a su solo arbitrio, sin necesidad de previa notificación.\n\nDÉCIMO QUINTO: Modificaciones Al Servicio.\n\nPassline se reserva el derecho de modificar, o discontinuar el Servicio o cualquier parte del mismo, temporal o permanentemente, en cualquier momento y periódicamente, por lo que Passline no será responsable hacia Ud. o terceras partes por ninguna modificación, suspensión o interrupción del mismo.\n\nDÉCIMO SEXTO: Terminación.\n\nUsted acepta que Passline puede, bajo ciertas circunstancias y sin necesidad de notificación previa, pueda cancelar y terminar inmediatamente su cuenta, cualquier dirección de correo electrónico asociada y su acceso al Servicio. Entre las causales de terminación se incluyen, sin limitarse: (a) incumplimientos o violaciones a estos TCS o a otros acuerdos o lineamientos incorporados; (b) requerimientos de autoridades legales o gubernamentales; (c) su solicitud (terminación de cuenta por requerimiento del usuario); (d) terminación o modificaciones sustanciales al Servicio (o cualquier parte del mismo); (e) problemas técnicos o de seguridad inesperados; (f) períodos de inactividad prolongados. La terminación de su cuenta Passline incluye: (a) la cancelación del acceso a todas las ofertas dentro del Servicio; (b) el borrado de su clave y de toda la información relacionada, archivos y de todo el contenido asociado con o dentro de su cuenta (o de cualquier parte de la misma); y (c) prohibir el uso posterior del Servicio. Asimismo, Ud. acepta que todas las causales de terminación con causa podrán ser invocadas por Passline a su única discreción y que este no será responsable frente a Ud. ni frente a ningún tercero por cualquier terminación de su cuenta, y las direcciones de correo electrónico asociadas.\n\nDÉCIMO SEPTIMO: Derechos de Propiedad de Passline.\n\nUd. reconoce, acepta y acuerda que el Servicio y cualquier software necesario usado en conexión con este contiene propiedad e información confidencial que se encuentra protegida bajo las leyes aplicables de propiedad intelectual. Además, Ud. reconoce y acepta que el Contenido incluido en publicidad de anunciantes o información presentada a Ud. por medio del Servicio, está protegida por los derechos de autor, marcas comerciales, marcas de servicio, patentes y otros derechos y leyes de propiedad. Con excepción a lo expresamente autorizado por Passline o los anunciantes, Ud. se compromete a no modificar, alquilar, arrendar, prestar, vender, distribuir o crear obras derivadas basadas en el Servicio o en el Software, en todo o en parte. Passline le otorga a Ud. un derecho y licencia personal, intransferibles y no exclusiva para usar el código objeto de su Software en una sola computadora o dispositivo; siempre y cuando no copie, modifique, haga una obra derivada de, haga ingeniería inversa, haga ensamblaje inverso, o de cualquier otra manera intente descubrir alguno de los códigos fuente, venda, asigne, sub-licencie, otorgue en garantía o de cualquier otra forma transfiera cualquier derecho en el Software, o permita a terceros hacer cualquiera de estas acciones Usted se obliga a no modificar de ninguna manera el Software o a usar versiones modificadas del Software, incluyendo, sin limitación, con el propósito de obtener acceso no autorizado al Servicio.\n\nPassline, declara reconocer y aceptar como propiedad del Cliente y sus sociedades relacionadas, todos sus símbolos, logos, marcas, nombres comerciales, designaciones, denominaciones, figuras, dibujos, interfaces gráficas, frases publicitarias relacionadas. Sin perjuicio de ello, por este acto el Cliente autoriza a Passline para que estas sean desplegadas en todos aquellos sistemas y páginas que estén relacionadas con la difusión, venta de entradas, y similares, de su Evento.\n\nDÉCIMO OCTAVO: Límite de Garantías.\n\nUsted expresamente comprende y conviene que: (a). El uso del servicio es bajo su propio riesgo. El servicio es provisto tal cual es y según se encuentre disponible, por lo que Passline no otorga garantía de ningún tipo, ya sea expresa o implícita. (b). Passline no garantiza que (i) el servicio se ajuste a sus necesidades, (ii) el servicio sea ininterrumpido, puntual, seguro o libre de error, (iii) los resultados que puedan ser obtenidos del uso del servicio sean veraces o confiables, (iv) la calidad de cualquier producto, servicio, información u otro material comprado u obtenido por usted por medio del servicio se ajustara a sus expectativas y (v) cualquier error en el software será corregido. (c) Cualquier material descargado o de cualquier otra forma obtenido por medio del uso del servicio es hecho bajo su propia discreción y riesgo y usted será absolutamente responsable por cualquier daño al sistema de su computadora o perdida de datos que resulten de la descarga de cualquiera de estos materiales. (d) ningún consejo o información, ya sea oral o escrito, obtenido por usted por medio de Passline, o por medio del servicio constituirá garantía alguna, a no ser que se encuentre expresamente establecido en los TCS.\n\nDÉCIMO NOVENO: Límite de Responsabilidad.\n\nUd. comprende y acuerda expresamente que Passline no será responsable por ningún daño, interés o perjuicio directo o indirecto, previsto o imprevisto, intrínseco o extrínseco, incluyendo (pero sin limitarse a ello) lucro cesante, o pérdida de prestigio, uso, datos u otras perdidas intangibles (aun en el caso que Passline hubiera sido advertida de la posibilidad de tales daños), resultante de: (a) el uso o imposibilidad de usar el servicio; (b) el costo de obtención de bienes o servicios sustitutos resultante de la falla de cualquier bien, dato, información o servicio adquirido u obtenido por medio del servicio, o mensaje recibido, o transacciones realizadas, por medio o desde el servicio; (c) el acceso no autorizado a sus transmisiones, o alteración de las mismas, o de sus datos; (d) las declaraciones o conductas de cualquier tercero en el servicio; o (e) cualquier otro asunto relacionado al servicio. Todas las condiciones estipuladas respecto de Passline en este artículo y el anterior se aplican a Passline, sus sociedades contratantes, controladas o bajo el control común.\n\nVIGÉSIMO: Advertencia Especial para los Servicios relacionados a Asuntos Financieros.\n\nEl Servicio es provisto para fines informativos únicamente y ningún contenido incluido en el Servicio fue dispuesto con propósitos comerciales o de inversión, por lo que ni Passline ni sus licenciantes serán responsables por la veracidad, utilidad o disponibilidad de cualquier información transmitida o puesta a disposición a través del Servicio, y no serán responsables o tendrán obligación alguna por ninguna decisión comercial o de inversión hecha en base a dicha información.\n\nVIGÉSIMO PRIMERO: No Existencia de Terceros Beneficiados.\n\nUd. acepta que, salvo que se prevea lo contrario en estos TCS, no existirán terceros beneficiarios a este Contrato.\n\nVIGÉSIMO SEGUNDO: Notificaciones.\n\nLas notificaciones, incluyendo aquellas relativas a cambios a los TCS, podrán ser enviadas por medio del correo electrónico o correo regular o anunciar en el Servicio.\n\nVIGÉSIMO TERCERO: Marcas Comerciales.\n\nLas marcas comerciales de Passline, su logo, así como otros logos son de su propiedad. Ud. se obliga a no mostrar o usar de ninguna manera las Marcas Passline sin autorización previa y por escrito de Passline.\n\nVIGÉSIMO CUARTO: Derecho de Propiedad.\n\nPassline respeta el derecho de propiedad intelectual de terceros y requerimos a nuestros usuarios que hagan lo mismo. Passline puede, en circunstancias apropiadas y a su discreción, desactivar o terminar las cuentas de usuarios que son infractores reiterados. En caso de que Ud. crea que su obra ha sido copiada de una manera que constituya una infracción a los derechos de autor, o sus derechos de propiedad intelectual fueren violados en cualquier forma, Ud. por favor provea al Agente de los Derechos de Autor de Passline la siguiente información: 1. una firma electrónica o física de la persona autorizada a actuar en representación del dueño de los intereses de los derechos de autor. 2. una descripción de las obras protegidas u otra propiedad intelectual que Ud. afirma han sido violadas; 3. Una descripción de la ubicación en el sitio del material que Ud. afirma está en infracción; 4. Su dirección, número de teléfono y dirección de correo electrónico; 5. Una declaración suya estableciendo que Ud. cree de buena fe que el uso en cuestión no ha sido autorizado por el dueño del derecho de autor, su agente o la ley; 6. Una declaración suya bajo pena de perjurio, que la información arriba señalada en su Notificación es verdadera y que Ud. es el dueño del derecho de autor o propiedad intelectual o está autorizado a actuar en representación del dueño de los derechos de autor o propiedad intelectual en cuestión. El Agente de Passline para Notificación de quejas por violación a los derechos, quien puede ser contactado por correo: info@passline.cl, Área de Atención al Cliente de Tecnología APP Mobile Limitada, Santiago, Chile.\n\nVIGÉSIMO QUINTO: Consideraciones Finales.\n\nEl presente instrumento constituye el único acuerdo entre Ud. y Passline y rigen el uso del Servicio, reemplazando cualquier contrato previo entre Ud. y Passline que presente las mismas características, lo anterior es sin perjuicio de acuerdos anexos que las partes puedan convenir, los que se entenderán complementarios a las normas y cláusulas expuestas. Asimismo, Ud. también estará sujeto a los términos y condiciones adicionales que puedan serle aplicables cuando use o compre otros servicios de Passline, servicios afiliados, contenidos de terceras partes o software de terceras partes.\n\nVIGÉSIMO SEXTO: Ley Aplicable.\n\nLos TCS y la relación entre Ud. y Passline serán regidos por las leyes de la República Chile, sin perjuicio de las disposiciones aplicables acerca de conflicto de leyes. Usted y Passline acuerdan expresamente en someterse a la jurisdicción de los tribunales ordinarios de la Ciudad de Santiago, Chile, renunciando a cualquier otro fuero o jurisdicción que pudiera corresponder. Renuncia. Integración: La renuncia o tolerancia por parte de Passline respecto del ejercicio de algún derecho o disposición de los TCS no constituirá renuncia a dicho derecho o disposición. Si algún tribunal de jurisdicción competente resuelve que alguna disposición de los TCS es inválida, las partes de cualquier modo acuerdan que tal tribunal deberá valorar y dar efecto a la intención de las partes reflejada en dicha disposición, manteniendo las restantes disposiciones de los TCS en pleno vigor y efecto.\n\nVIGÉSIMO SEPTIMO: Tarifas.\n\nPassline cobrará un porcentaje del valor de cada ticket vendido y adicionalmente cobrará el costo por el servicio de recaudación mediante la pasarela de pago. El monto total a cobrar será del 15% por sobre el valor de la venta, con un cargo por servicio mínimo de $500 IVA Incluido. Esto corresponde al cobro por uso de la plataforma de Passline más las comisiones pertinentes de los servicios de recaudación que varían dependiendo del monto de pago. Respecto a la comisión antes mencionada, está incluye el Impuesto Al Valor Agregado (IVA), pero no estarán incluidos otros impuestos que por ley puedan corresponder o que puedan afectar a dicha venta. Sin perjuicio de lo ya mencionado, se deberá agregar un cargo de $1.000.- (mil pesos chilenos) a las ventas realizadas por cobro efectivo o pago internacional por concepto de “cobro por transacción”, la que será incluida en el total de la deuda.\n\nAsimismo, le recordamos que usted es el responsable de pagar el Impuesto al Valor Agregado (IVA) o cualquier tipo de impuesto asociado a la venta de entradas o tickets, obligándose además a emitir todos los comprobantes fiscales a los usuarios o participantes que recibieren o realizaren una inscripción a través del Servicio.\n\nDado que Passline hace las veces de recaudador de dinero proveniente de las ventas de Tickets, es menester del Productor indicar la cuenta corriente pertinente y válida para efectuar las reversas de dinero de donde Passline hará las deducciones correspondientes mencionadas en la parte superior de esta cláusula.\n\nPassline se limitará a efectuar los depósitos dentro de los 15 días subsiguientes a la terminación del evento y sólo lo hará a la cuenta previamente establecida. Cualquier modificación de las cuentas corrientes debe ser autorizada por Passline, quien se reserva el derecho de no aceptar.",
                  "tyc_usuarios_columna1": "Al usar nuestros servicios Ud. declara ser mayor de edad y otorga su consentimiento libre, previo y expreso. Sí Ud. es menor de edad, deberá contar con el consentimiento de su tutor.\n\nPRIMERO: Condiciones Generales.\nAl comprar entradas a través del sistema web de Tecnología App Mobile SpA, en adelante \"Passline\", el Usuario acepta las condiciones que se establecen a continuación, manifestando su total conformidad con éstas.\n\nLe solicitamos leer atentamente los términos y condiciones que rigen el uso de nuestra página web, junto con los alcances de la compra de ticket físico o electrónico, en adelante la/s \"Entrada/s\".\n\nEl presente instrumento regula el uso de la página web de Passline, Rol único Tributario N° 76.415.882-2, con domicilio social en Abadía 212, Las Condes, Santiago, Chile.\n\nSEGUNDO: Antecedentes Generales\nPassline es una sociedad dedicada a la venta de entradas para espectáculos artísticos, culturales y/o deportivos, en adelante los “Eventos”, a través de la venta de forma presencial, por módulos o tótems electrónicos de auto-atención y/o por medios remotos e Internet (electrónica).\n\nPassline actúa como mandataria, esto es, por cuenta y orden del organizador, productor o gestor del evento o espectáculo, en adelante también el “Organizador”, prestando a este último solo los servicios de venta y distribución de entradas para los eventos, en alguna de las formas señaladas en el párrafo anterior. \n\nEl Organizador es el único y exclusivo responsable de la producción y organización del Evento, sujeto a las condiciones de venta que el mismo establezca. El Organizador es el responsable por la definición de precios, características del evento, cargos por servicio y la correcta ejecución del evento respectivo, por lo que Passline no asume responsabilidad a este respecto.\n\nTERCERO: Condiciones de Uso del Sitio Web.\nEl Usuario de nuestra página web se compromete a hacer uso de la misma con fines exclusivamente personales. La página web de Passline tiene por fin poner a disposición de los consumidores (i) información relativa a eventos sobre los que ésta comercializa sus entradas y (ii) un sistema de compra de entradas para los mismos, de acuerdo a las condiciones definidas para cada evento.\n\nQueda prohibida la descarga, modificación o alteración, en cualquier forma, de los contenidos publicados en la página. El contenido y software de este sitio es propiedad de Passline y está protegido bajo tratados internacionales y leyes nacionales del derecho de autor y propiedad intelectual.\n\nEl Usuario de la página web, del tótem de auto atención y Usuario presencial no podrán hacer uso de la misma con fines ilícitos, que lesionen derechos e intereses de terceros, o que de cualquier forma puedan dañar, inutilizar, sobrecargar, deteriorar o impedir la normal utilización de este sitio, los equipos informáticos o los documentos, archivos y toda clase de contenidos almacenados en cualquier equipo informático de Passline. La infracción de las condiciones de uso del portal por parte de un Usuario implicará la cancelación de su cuenta y la anulación de las compras realizadas por éste. Todo lo anterior se entiende en relación a la expresa reserva de acciones legales tanto penales como civiles para los casos de infracción.\n\nCUARTO: Condiciones de Venta.\nPassline pone a disposición de sus Usuarios todos sus puntos de ventas, entendiéndose por tales los correspondientes a ventas presenciales a través del tótem electrónico de auto atención y página web. (puntos de evento físico que recaudan efectivo, Banco Estado, caja vecina, etc.).\n\nAntes de confirmar su compra realizada por los medios ya establecidos, el Usuario deberá revisar el detalle de su orden en pantalla, ya que no está permitido realizar cambios, reembolsos ni devoluciones de Boletos una vez finalizado el proceso de compra, de acuerdo a lo establecido en el presente instrumento.\n\nLa transacción quedará sujeta a la verificación por parte de la empresa emisora de la tarjeta bancaria u otro medio de pago elegido por el Usuario. No se considerará como completa una transacción mientras Passline no reciba la autorización de la institución financiera respectiva. En caso que Passline no reciba dicha confirmación, se anulará la compra.\n\nQUINTO: Condiciones de Entrega.\nAl adquirir sus Entradas a través de nuestra página Web el Usuario recibirá un código único QR a su correo electrónico previamente registrado, el que representa para todos los efectos la entrada etickets. De esta manera, los etickets correspondientes al evento o servicio contratado podrán ser enviados por SMS o vía aplicaciones de comunicación como “Whatsapp” o similares,  cuando así lo posibilite la plataforma.\n\nEsto es sin perjuicio de la venta realizada en los tótem de autoservicio donde este emitirá una entrada impresa.\nPassline se reserva el derecho a limitar los puntos de venta para el retiro de Boletos de determinados Eventos. Esto será debidamente publicado en la página Web.\n\nSEXTO: Política de Devoluciones tarifa normal\nPassline declara expresamente que al adquirir su entrada a través de Internet el derecho a retracto se encuentra excluido. En consecuencia, una vez finalizado el proceso de compra, no se realizarán cambios ni devoluciones, de acuerdo a los términos previstos en el artículo 3 bis de la Ley 19.496 “Sobre protección de los derechos de los consumidores”.Será de su exclusiva responsabilidad la revisión de todos los antecedentes proporcionados en el proceso de compra y de las características de los eventos o servicios contratados. No se procederá a reembolsar por “errores” en la compra de dichos eventos y servicios.\n\nEn caso de venta presencial o entradas compradas en tótem de auto servicio y en el evento de pérdida, daño, robo o extravío, no se realizarán reimpresiones de Entradas. Las Entradas son al portador.\n\nEn caso de que dichas entradas hayan sido adquiridas mediante nuestra página web, también se consideran al portador, por ello, en caso de pérdida no podrá ser reenviada.\n\nEn caso de cancelación del Evento, se procederá a realizar la devolución de los montos recaudados a nuestros Usuarios, previa autorización, coordinación y publicación por parte del Organizador del mismo.\n\nEn caso de cambios en la configuración del Evento ya sea de fecha, horario, lugar del mismo, o cambio sustancial en las características de éste, Passline procederá a la devolución de los montos pagados a aquellos Usuarios que lo soliciten, previa autorización delOrganizador del evento.\n\nDada la relación contractual entre el Organizador y Passline, la responsabilidad de proceder con la devolución de dineros es del Organizador. Sin autorización previa, Passline no puede realizar estas devoluciones.",
                  "tyc_usuarios_columna2": "Las devoluciones a que se refiere esta cláusula se realizarán en las mismas condiciones en que el consumidor las adquirió.\n\nEn el caso de hayan sido compradas en forma presencial o mediante el Totem de auto servicio sólo se realizarán devoluciones contra la entrega de las Entradas físicas adquiridas directamente.\n\nQuedan expresamente excluidos de devolución, los precios pagados por las Entradas adquiridas directamente con el Organizador, en concursos o cualquier otra instancia distinta de las mencionadas anteriormente. La devolución de estas entradas deberá ser gestionada directamente por la institución que las vendió o entregó al Usuario final aun cuando hayan sido emitidas originalmente por Passline.\n\nLa entrega del dinero pagado por el precio de la Entrada se realizará mediante transferencia bancaria. En caso de que no sea posible para el cliente otorgar su información bancaria, se solicita enviar un correo electrónico a contacto@passline.cl para proceder a la devolución en efectivo.\n\nEn todos los casos mencionados anteriormente el plazo de devolución será de _20 días hábiles.\n\nSEPTIMO: Política de Devoluciones Cargo Premium\nSi Ud. adquirió su entrada mediante la Cargo Premium, podrá efectuar la devolución de su entrada y solicitar el reembolso total de la suma pagada, siempre y cuando la devolución se realice al menos 24 Horas antes de la fecha del evento, solicitándolo a través de url passline.com/devoluciones\n\nLa entrega del dinero pagado por el precio de la Entrada se realizará mediante transferencia bancaria. En caso de que no sea posible para el cliente otorgar su información bancaria, se solicita enviar un correo electrónico a contacto@passline.cl para proceder a la devolución en efectivo.\n\nEn todos los casos mencionados anteriormente el plazo de devolución será de _20 días hábiles.\n\nOCTAVO: Servicio al Cliente.\nCon el fin de contestar todas las dudas que estos puedan tener sobre los términos y condiciones y solucionar cualquier problema con los servicios prestados por Passline, los consumidores pueden ponerse en contacto con nuestra mesa de ayuda llamando al +562 2234 1369 o escribiendo al email contacto@passline.cl. Para información sobre los eventos, visite nuestro portal www.passline.cl.\n\nEn caso de solicitar devoluciones favor contactarse a los mismos teléfonos y datos entregados en la primera parte de la presente cláusula, sin perjuicio de ello, recalcamos que Passline actúa como mandatario, esto es, por cuenta y riesgo del Organizador. Por lo tanto, que el evento se  realice en las condiciones descritas y en conformidad con la ley es de responsabilidad exclusiva del Organizador. Passline sin perjuicio de ello, siempre responderá dudas y tratará de prestar un servicio de calidad a sus Clientes, para que la experiencia de compra y de servicio sea la mejor.\n\nNOVENO: Almacenamiento de información.\nPassline realiza un proceso de tratamiento de datos con el fin de celebrar con el Usuario un contrato de compraventa de entradas de los diferentes Eventos que se ofrecen en la Página Web que el Usuario libremente elige.\nPara realizar la transacción señalada, se almacenan datos de carácter personal del Usuario, previo consentimiento de éste, relativos a su nombre completo, cédula nacional de identidad, domicilio, teléfono, fecha de nacimiento, género y dirección de correo electrónico.\n\nNo se almacenan datos relativos a los medios de pago que el Usuario utiliza para celebrar la compraventa de Entradas para el Evento. Además Passline no realiza ningún procedimiento de validación de los datos entregados por el Usuario, por lo que es de su responsabilidad la veracidad de los mismos.\n\nDECIMO: Uso de información almacenada.\nPassline utiliza la información del Usuario, previo consentimiento de éste, para su almacenamiento, con el fin de realizar la venta de Entradas para los distintos Eventos ofrecidos. Asimismo, el uso de los Datos Personales Registrados en el Sitio Web tiene como única finalidad validar las órdenes de compra y mejorar la labor de información y comercialización de los productos y servicios prestados por Passline.\n\nDÉCIMO PRIMERO: Procedimiento de modificación, eliminación o cancelación de datos almacenados.\nA requerimiento del Usuario, se procederá a eliminar los datos caducos y aquellos cuya exactitud no pueda ser establecida o cuya vigencia sea dudosa.\n\nPara iniciar el procedimiento de modificación o eliminación de los datos, el Usuario deberá enviar un correo electrónico a la dirección contacto@passline.cl, solicitando la modificación o eliminación de los datos y explicando la razón de la solicitud.\n\nNo obstante los procedimientos descritos anteriormente, el Usuario podrá eliminar, en cualquier momento, su cuenta y los datos que se contengan en ella desde la plataforma Web.\n\nDÉCIMO SEGUNDO: Política de Privacidad.\nPassline utiliza la tecnología más avanzada para la protección de la información proporcionada por los Usuarios de los Servicios.\n\nEl uso de los Datos Personales Registrados en el Sitio Web tiene como única finalidad validar las órdenes de compra y mejorar la labor de información y comercialización de los productos y servicios prestados. Dicho datos no serán traspasados a terceros, salvo personas o empresas relacionadas con Passline.\n\nEn razón de lo anterior se han implementado todas las medidas de seguridad para proteger los datos personales requeridos a los Usuarios que hacen uso de la página Web.\n\nSe podrán generar bases de datos con la información proporcionada por el usuario, las que se utilizarán por Passline exclusivamente para fines comerciales.\n\nToda información solicitada al Uuario, deberá ser proveída por éste de manera voluntaria.\n\nDÉCIMO TERCERO: Uso de cookies y seguridad.\nEl servidor de datos por parte de Passline contempla el envío de datos al navegador del Usuario para que se almacenen en el disco duro de su computadora y así permitir identificar las computadoras utilizados por los Usuarios al tener acceso a nuestro Portal, este proceso es conocido como el uso de \"cookies\" o \"direcciones de IP\". Mediante el uso de \"cookies\" o \"direcciones de IP\" Passline es capaz de ofrecer un servicio más personalizado a sus Usuarios dado que esto permite entre otras cosas, ofrecer campañas publicitarias y de promoción como a la vez medir el tamaño de nuestra audiencia y el flujo de tráfico en los distintos sitios que el cliente visita.\n\nDÉCIMO CUARTO: Exención de Responsabilidades.\nA pesar del constante esfuerzo de Passline por entregar a sus usuarios la mejor experiencia y calidad posible, la empresa no se obliga a que el sitio esté libre de errores e interrupciones. En relación a lo anterior, no se garantiza la ausencia de virus ni de otros elementos en los contenidos que puedan producir alteraciones en su sistema informático (software y hardware) o en los documentos electrónicos y ficheros almacenados en su sistema informático. Por lo anterior, Passline se exime, con toda la extensión permitida por el ordenamiento jurídico, de cualquier responsabilidad por los daños y perjuicios de toda naturaleza que puedan deberse a la presencia de virus o a la presencia de otros elementos en los contenidos que puedan producir alteraciones en el sistema informático, documentos electrónicos o ficheros de los usuarios.\n\nPassline, como ticketera, publica la información entregada por los productores del evento y no tiene injerencia en las condiciones comerciales que estos definan para cada evento. Así como tampoco es responsable por cambios que se produzcan, previo o durante, en la configuración del mismo.\n\nPassline no se hace responsable por daños o lesiones sufridas por los clientes o terceras personas durante el desarrollo del evento. Tampoco se hace responsable de los gastos incurrido por los clientes para la compra, asistencia u/o modificación y cancelación de algún evento."
              }
