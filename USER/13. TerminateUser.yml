http:
  method: GET
  url: "{{url}}/user/TerminateUser"
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{Token_productor}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

