http:
  method: PUT
  url: "{{url}}/user/SendNewPassword"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"email\": \"ariel.daza.development@gmail.com\"\r

      }\r\n"

