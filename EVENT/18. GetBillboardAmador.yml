                  "descripcion": "Mansión Blackwood: Atrévete a Enfrentar el Verdadero Terror\r\n\r\nSumérgete en la oscuridad de la Mansión Blackwood, la experiencia de terror más extrema y realista de Panamá. Desde el momento en que cruzas el umbral de esta antigua mansión, cada rincón te acecha con secretos macabros y criaturas que pondrán a prueba tus miedos más profundos.\r\n\r\nCon personajes escalofriantes, efectos especiales sorprendentes y un recorrido lleno de desafíos, este es un viaje que no olvidarás. ¿Serás capaz de sobrevivir a la maldición de la familia Blackwood?\r\n\r\n⚠️ Advertencia: Esta atracción no es apta para personas sensibles.\r\nEdad recomendada: 12 años en adelante (los menores deben ir acompañados de un adulto responsable).\r\n\r\nUbicación: Entrada del Downtown Amador \r\nHorarios: Miércoles a Domingo, de 7:00 p.m. a 12:00 a.m.\r\n\r\n¿Te atreves a entrar? Compra tus boletos ahora y prepárate para vivir el terror en carne propia. ¡No digas que no te lo advertimos!",
